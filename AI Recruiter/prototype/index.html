        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');

    <script type="text/babel" data-presets="env,react">
      /* ============================================================================
         AuditReady — Working Demo (single-file React SPA)
         Agentic hiring + independent third-party bias auditing.
         No build step. No backend. All processing is real and runs in your browser.
         ============================================================================ */

      const { useState, useEffect, useMemo, useRef, Fragment } = React;
      const R = window.Recharts || {};
      const {
        ResponsiveContainer, BarChart, Bar, XAxis, YAxis, Tooltip, CartesianGrid, Cell,
        RadialBarChart, RadialBar, PolarAngleAxis, AreaChart, Area, LineChart, Line,
      } = R;

      function classNames() { return Array.from(arguments).filter(Boolean).join(' '); }

      /* ---------------------------------------------------------------------------
         Skill library + sample JD/Resume + parsing/scoring (real, runs locally)
         --------------------------------------------------------------------------- */
      const SKILL_LIBRARY = [
        // Languages
        'python','javascript','typescript','java','go','rust','c++','c#','ruby','php','kotlin','swift','scala','sql',
        // Web / Frontend
        'react','vue','angular','svelte','next.js','nuxt','tailwind','redux','graphql','webpack','vite',
        // Backend / API
        'node','express','django','flask','fastapi','spring','spring boot','rails','microservices','rest','grpc','api design',
        // Cloud / DevOps
        'aws','gcp','azure','docker','kubernetes','k8s','terraform','ansible','ci/cd','jenkins','github actions','gitlab','circleci',
        // Data / Storage
        'postgresql','postgres','mysql','mongodb','redis','kafka','rabbitmq','snowflake','bigquery','databricks','spark','hadoop','airflow','dbt','elasticsearch',
        // SAP
        'sap','s/4hana','s4hana','abap','fico','mm','sd','pp','qm','ewm','mdg','successfactors','employee central','ariba','btp','fiori','ui5','hana','analytics cloud','joule',
        // AI / ML
        'machine learning','deep learning','pytorch','tensorflow','scikit-learn','llm','nlp','transformers','rag','langgraph','langchain','mlops','foundation models','ai agents','agentic ai','knowledge graph',
        // Distributed / Systems
        'distributed systems','event-driven','event sourcing','cqrs','service mesh','observability','opentelemetry','prometheus','grafana','sre',
        // Soft / Process
        'leadership','mentoring','mentorship','communication','product thinking','agile','scrum','kanban','stakeholder management',
        // Compliance / Domain
        'gxp','hipaa','sox','gdpr','pci','eeoc','fda','21 cfr part 11','soc 2','iso 27001','bias audit','aedt','local law 144',
      ];

      const SAMPLE_JD = `Senior Backend Engineer — Hybrid NYC

About the role
We are hiring a Senior Backend Engineer to join our platform team. You will design and build distributed systems serving 10M+ requests/day across our SaaS platform. You will partner with product, ML, and SRE teams.

Required (must-haves)
- 5+ years building production backend services
- Strong proficiency in Python or Go
- Experience with PostgreSQL, Redis, Kafka
- AWS or GCP cloud experience
- Kubernetes, Docker, CI/CD
- Microservices and API design
- Distributed systems experience

Nice to have
- LangGraph or LangChain experience
- LLM and RAG integration experience
- Mentoring junior engineers
- Open-source contributions

What you'll do
- Design APIs serving 10M+ daily requests
- Lead architecture reviews
- Mentor 2-3 junior engineers
- Own the on-call rotation for the platform team

Location: NYC (Hybrid, 3 days/week in office)
Compensation: $185,000 - $225,000 base + equity
Hiring manager: Priya Kapoor, Director of Platform
`;

      const SAMPLE_RESUME = `Aisha Williams
Senior Software Engineer | NYC, NY
aisha.williams@example.com | github.com/aisha-w | linkedin.com/in/aishaw

PROFESSIONAL SUMMARY
Senior backend engineer with 6 years of experience designing distributed systems and APIs at scale. Strong proficiency in Python, Go, and microservices architecture. Mentored 4 junior engineers. NYC-based, open to hybrid roles.

EXPERIENCE

Senior Backend Engineer — Acme Cloud (2022 - Present)
- Built distributed Python microservices handling 5M requests/day
- Designed PostgreSQL schemas and Redis caching strategy across 12 services
- Led migration from EC2 to Kubernetes on AWS, reducing infra cost by 38%
- Implemented Kafka event pipeline for billing and audit events
- Mentored 4 junior engineers; ran weekly architecture reviews
- On-call lead for platform team; reduced p95 latency by 47%

Backend Engineer — Beta Labs (2019 - 2022)
- Built APIs in Go and Python, REST + gRPC
- Implemented CI/CD using GitHub Actions and Docker
- Worked with LangChain to ship RAG-powered support chatbot (LLM integration)
- Contributed to internal observability stack (Prometheus, Grafana, OpenTelemetry)

EDUCATION
B.S. Computer Science, NYU (2019)

SKILLS
Python, Go, PostgreSQL, Redis, Kafka, AWS, Kubernetes, Docker, CI/CD,
Microservices, Distributed Systems, REST, gRPC, API Design,
LangChain, LLM, RAG, Prometheus, Grafana, OpenTelemetry,
Mentoring, Leadership, Communication

OPEN SOURCE
- Maintainer: pyqueue (Python distributed task queue, 1.2k GitHub stars)
- Contributor: langchain (Python AI framework)
`;

      const RE_META = /[.*+?^${}()|[\]\\]/g;
      function escapeRe(s) { return String(s).replace(RE_META, '\\$&'); }

      function extractSkills(text) {
        if (!text) return [];
        const found = [];
        const seen = new Set();
        const lower = text.toLowerCase();
        for (const skill of SKILL_LIBRARY) {
          const pat = '(?:^|[^a-z0-9+#./])' + escapeRe(skill) + '(?:$|[^a-z0-9+#./])';
          const re = new RegExp(pat, 'i');
          if (re.test(lower) && !seen.has(skill)) {
            seen.add(skill);
            found.push(skill);
          }
        }
        return found;
      }

      function extractYears(text) {
        if (!text) return 0;
        const m = String(text).match(/(\d+)\s*\+?\s*years?/i);
        return m ? parseInt(m[1], 10) : 0;
      }

      function extractLocation(text) {
        if (!text) return '';
        const lower = String(text).toLowerCase();
        if (lower.includes('remote')) return 'Remote';
        const cities = ['nyc','new york','brooklyn','jersey city','san francisco','seattle','boston','chicago','austin','london'];
        for (const c of cities) if (lower.includes(c)) return c.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
        return '';
      }

      function extractLevel(text) {
        if (!text) return '';
        const lower = String(text).toLowerCase();
        const levels = ['principal','staff','senior','lead','mid','junior','entry'];
        for (const l of levels) if (lower.includes(l)) return l.charAt(0).toUpperCase() + l.slice(1);
        return '';
      }

      function extractComp(text) {
        if (!text) return null;
        const m = String(text).match(/\$\s*([\d,]+)\s*[-\u2013to]+\s*\$?\s*([\d,]+)/);
        if (m) return { lo: parseInt(m[1].replace(/,/g, ''), 10), hi: parseInt(m[2].replace(/,/g, ''), 10) };
        return null;
      }

      function scoreCandidate(jdText, resumeText) {
        const jdSkills = extractSkills(jdText);
        const resumeSkills = extractSkills(resumeText);
        const jdYears = extractYears(jdText);
        const resumeYears = extractYears(resumeText);
        const jdLocation = extractLocation(jdText);
        const resumeLocation = extractLocation(resumeText);
        const jdLevel = extractLevel(jdText);
        const resumeLevel = extractLevel(resumeText);

        const jdSet = new Set(jdSkills);
        const matched = resumeSkills.filter(s => jdSet.has(s));
        const matchedSet = new Set(matched);
        const missing = jdSkills.filter(s => !matchedSet.has(s));
        const extra = resumeSkills.filter(s => !jdSet.has(s));

        const skillRatio = jdSkills.length > 0 ? matched.length / jdSkills.length : 0.5;
        const yearsRatio = jdYears > 0 ? Math.min(resumeYears / jdYears, 1.2) : 1.0;
        const locationMatch = jdLocation && resumeLocation && (jdLocation === resumeLocation || resumeLocation === 'Remote');
        const levelMatch = jdLevel && resumeLevel && (jdLevel.toLowerCase() === resumeLevel.toLowerCase());

        const skillScore = Math.round(skillRatio * 55);
        const yearsScore = jdYears > 0 ? Math.round(yearsRatio * 25) : 18;
        const locationScore = locationMatch ? 8 : (jdLocation ? 0 : 5);
        const levelScore = levelMatch ? 7 : (jdLevel ? 3 : 5);
        const bonusScore = Math.min(extra.length, 5);

        const score = Math.min(100, skillScore + yearsScore + locationScore + levelScore + bonusScore);

        return {
          score,
          matchPercent: Math.round(skillRatio * 100),
          breakdown: [
            { label: 'Skills match', got: skillScore, max: 55, detail: matched.length + ' of ' + jdSkills.length + ' required skills' },
            { label: 'Years of experience', got: yearsScore, max: 25, detail: resumeYears + ' yrs vs ' + (jdYears || '—') + ' required' },
            { label: 'Location fit', got: locationScore, max: 8, detail: locationMatch ? (resumeLocation + ' matches ' + jdLocation) : (jdLocation ? 'No location match' : 'Location not specified') },
            { label: 'Level match', got: levelScore, max: 7, detail: levelMatch ? (resumeLevel + ' = ' + jdLevel) : (jdLevel ? 'Level differs' : 'Level not specified') },
            { label: 'Bonus depth', got: bonusScore, max: 5, detail: extra.length + ' bonus skills' },
          ],
          jdSkills, resumeSkills, matched, missing, extra,
          jdYears, resumeYears, jdLocation, resumeLocation, jdLevel, resumeLevel,
        };
      }

      function findCitations(text, skills, limit) {
        if (!text) return [];
        const out = [];
        for (const skill of skills) {

        if (all.length === 0) return [text];
        const matchedSet = new Set(matched || []);
        const re = new RegExp('(' + all.map(escapeRe).join('|') + ')', 'gi');
        const parts = [];
        let lastIdx = 0;
        let m;
        let count = 0;
        const safe = String(text);
        while ((m = re.exec(safe)) !== null && count < 500) {
          if (m.index > lastIdx) parts.push(safe.slice(lastIdx, m.index));
          const found = m[0];
          const lc = found.toLowerCase();
          const tone = matchedSet.has(lc) ? 'match' : 'miss';
          parts.push({ tone, text: found });
          lastIdx = m.index + found.length;
          count++;

        if (lastIdx < safe.length) parts.push(safe.slice(lastIdx));

                <div className="mb-2 text-[10px] font-semibold uppercase tracking-[0.18em] text-white/60">System status</div>
                <SidebarStatus label="Agent pipeline" tone="ok" />
                <SidebarStatus label="Audit engine" tone="ok" />
                <SidebarStatus label="SAP integrations" tone="ok" />
              </div>
              <div className="flex items-center gap-2 px-1">
                <div className="flex h-8 w-8 items-center justify-center rounded-full bg-brand-500/20 text-xs font-semibold text-brand-100">DV</div>
                <div className="text-xs">
                  <div className="font-semibold">Demo viewer</div>
                  <div className="text-white/60">Independent auditor</div>
                </div>
              </div>
            </div>
          </aside>
        );
      }
      function SidebarStatus({ label, tone }) {
        return (
          <div className="flex items-center justify-between py-1 text-[12px] text-white/80">
            <span>{label}</span>
            <span className="inline-flex items-center gap-1.5"><span className={classNames('h-1.5 w-1.5 rounded-full pulse-dot', tone === 'ok' ? 'bg-ok-500' : 'bg-warn-500')} /><span className={tone === 'ok' ? 'text-ok-100' : 'text-warn-100'}>OK</span></span>
          </div>
        );
      }

      function Topbar({ titleEyebrow, title, subtitle, right, theme, onToggleTheme }) {
        const isDark = theme === 'dark';
        return (
          <div className="flex flex-wrap items-end justify-between gap-4 border-b border-surface-200 bg-white/70 px-8 py-5 backdrop-blur">
            <div>
              {titleEyebrow && <div className="mb-1 text-[11px] font-semibold uppercase tracking-[0.18em] text-brand-600">{titleEyebrow}</div>}
              <h1 className="text-2xl font-bold tracking-tight text-ink-900">{title}</h1>
              {subtitle && <p className="mt-1 max-w-3xl text-sm text-ink-600">{subtitle}</p>}
            </div>
            <div className="flex items-center gap-2">
              {right}
              <button
                type="button"
                onClick={onToggleTheme}
                title={isDark ? 'Switch to light mode' : 'Switch to dark mode'}
                aria-label={isDark ? 'Switch to light mode' : 'Switch to dark mode'}
                className="theme-toggle inline-flex h-9 w-9 items-center justify-center rounded-lg border border-surface-200 bg-white text-ink-700 hover:bg-surface-50"
              >
                <Icon name={isDark ? 'sun' : 'moon'} className="h-4 w-4" />
              </button>
              <button className="inline-flex items-center gap-1.5 rounded-lg border border-surface-200 bg-white px-3 py-2 text-xs font-semibold text-ink-700 hover:bg-surface-50">
                <Icon name="bell" className="h-3.5 w-3.5" /> 3 alerts
              </button>
              <span className="hidden md:inline-flex"><Pill tone="ok" dot>Live</Pill></span>
            </div>
          </div>
        );
      }

      /* ---------------------------------------------------------------------------
         Page: Live Demo (the star — real-time pipeline)
         --------------------------------------------------------------------------- */
      const PIPELINE_STEPS = [
        { id: 'sourcer',    name: 'Sourcer Agent',     subtitle: 'Parsing JD & resume, extracting skills', delay: 1100, icon: 'search', tone: 'sky' },
        { id: 'screener',   name: 'Screener Agent',    subtitle: 'Computing explainable score with citations', delay: 1900, icon: 'list-checks', tone: 'violet' },
        { id: 'rubric',     name: 'Interviewer Prep',  subtitle: 'Generating rubric for first-round screen', delay: 1100, icon: 'message-square-dot', tone: 'emerald' },
        { id: 'scheduler',  name: 'Scheduler Agent',   subtitle: 'Allocating panel slot across timezones', delay: 700,  icon: 'calendar-clock', tone: 'amber' },
        { id: 'offer',      name: 'Offer Drafter',     subtitle: 'Drafting offer in approved comp band', delay: 1100, icon: 'file-signature', tone: 'rose' },
        { id: 'audit',      name: 'Audit Engine',      subtitle: 'Hash-chained event written to LL144 log', delay: 500,  icon: 'shield-check', tone: 'slate' },
      ];

      function LiveDemoPage() {
        const [jd, setJd] = useState('');
        const [resume, setResume] = useState('');
        const [phase, setPhase] = useState('idle'); // idle | running | done
        const [stepIdx, setStepIdx] = useState(-1);
        const [result, setResult] = useState(null);
        const [elapsedMs, setElapsedMs] = useState(0);
        const [tick, setTick] = useState(0);
        const startedAtRef = useRef(0);
        const tickerRef = useRef(null);

        const onSample = () => { setJd(SAMPLE_JD); setResume(SAMPLE_RESUME); };
        const onClear = () => { setJd(''); setResume(''); setResult(null); setPhase('idle'); setStepIdx(-1); setElapsedMs(0); };

        const run = () => {
          if (!jd.trim() || !resume.trim()) return;
          const computed = scoreCandidate(jd, resume);
          const offer = generateOffer(computed.score, extractComp(jd), computed.jdLocation, computed.jdLevel);
          const rubric = generateRubric(jd, computed.resumeSkills, computed.missing);
          const citations = findCitations(resume, computed.matched, 5);
          const fullResult = { ...computed, offer, rubric, citations, candidateId: 'CND-' + Math.floor(10000 + Math.random() * 90000), startedAt: new Date() };
          setResult(fullResult);
          setPhase('running');
          setStepIdx(-1);
          setElapsedMs(0);
          startedAtRef.current = performance.now();
          if (tickerRef.current) clearInterval(tickerRef.current);
          tickerRef.current = setInterval(() => {
            setElapsedMs(performance.now() - startedAtRef.current);
            setTick(t => t + 1);
          }, 80);
          let acc = 0;
          PIPELINE_STEPS.forEach((s, i) => {
            acc += s.delay;
            setTimeout(() => setStepIdx(i), acc);
          });
          setTimeout(() => {
            setPhase('done');
            if (tickerRef.current) clearInterval(tickerRef.current);
          }, acc + 400);
        };

        useEffect(() => () => { if (tickerRef.current) clearInterval(tickerRef.current); }, []);

        return (
          <div className="space-y-6">
            <DemoHero phase={phase} onRun={run} onSample={onSample} onClear={onClear} canRun={!!(jd.trim() && resume.trim())} />

            <div className="grid grid-cols-1 gap-6 lg:grid-cols-2">
              <DemoInput label="Job Description" placeholder="Paste a JD, or click 'Use sample'." value={jd} onChange={setJd} disabled={phase === 'running'} icon="briefcase" highlight={result && phase !== 'idle'} parts={result && phase !== 'idle' ? highlightSkills(jd, result.matched, result.missing) : null} />
              <DemoInput label="Candidate Resume" placeholder="Paste a resume, or click 'Use sample'." value={resume} onChange={setResume} disabled={phase === 'running'} icon="file-text" highlight={result && phase !== 'idle'} parts={result && phase !== 'idle' ? highlightSkills(resume, result.matched, []) : null} />
            </div>

            {phase !== 'idle' && (
              <Pipeline phase={phase} stepIdx={stepIdx} elapsedMs={elapsedMs} result={result} />
            )}

            {phase === 'done' && result && (
              <Fragment>
                <ResultsHeader result={result} />
                <ResultsBody result={result} />
                <ProductivityReport elapsedMs={elapsedMs} score={result.score} />
              </Fragment>
            )}
          </div>
        );
      }

      function DemoHero({ phase, onRun, onSample, onClear, canRun }) {
        return (
          <div className="relative overflow-hidden rounded-2xl border border-surface-200 bg-gradient-to-br from-ink-900 via-ink-900 to-ink-800 p-8 text-white shadow-card">
            <div className="pointer-events-none absolute inset-0 grid-pattern opacity-20" />
            <div className="relative grid grid-cols-1 items-center gap-8 lg:grid-cols-5">
              <div className="lg:col-span-3 space-y-4">
                <div className="inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-3 py-1.5 text-[11px] font-semibold uppercase tracking-[0.2em] text-brand-100">
                  <span className="h-1.5 w-1.5 rounded-full bg-ok-500 pulse-dot" />
                  Real pipeline · runs in your browser
                </div>
                <h2 className="text-3xl font-bold leading-tight tracking-tight md:text-4xl">
                  Paste a <span className="gradient-text">job description</span> and a <span className="gradient-text">resume</span>.<br />
                  Watch six AI agents do four hours of recruiter work in seconds.
                </h2>
                <p className="max-w-2xl text-sm leading-relaxed text-white/70">
                  Every step is logged for audit. Every score is explainable. Every decision is hash-chained into a tamper-evident log designed for NYC Local Law 144 and EEOC scrutiny.
                </p>
                <div className="flex flex-wrap items-center gap-3 pt-2">
                  <button onClick={onRun} disabled={!canRun || phase === 'running'} className={classNames('group inline-flex items-center gap-2 rounded-lg px-5 py-3 text-sm font-bold shadow-glow transition', canRun && phase !== 'running' ? 'bg-brand-500 text-white hover:bg-brand-600' : 'cursor-not-allowed bg-white/10 text-white/50')}>
                    <Icon name="play" className="h-4 w-4" /> {phase === 'running' ? 'Pipeline running…' : phase === 'done' ? 'Run again' : 'Run pipeline'}
                  </button>
                  <button onClick={onSample} className="inline-flex items-center gap-2 rounded-lg border border-white/15 bg-white/5 px-4 py-3 text-sm font-semibold text-white hover:bg-white/10">
                    <Icon name="wand-sparkles" className="h-4 w-4" /> Use sample
                  </button>
                  <button onClick={onClear} className="inline-flex items-center gap-2 rounded-lg border border-white/15 bg-transparent px-4 py-3 text-sm font-semibold text-white/80 hover:bg-white/5">
                    <Icon name="rotate-ccw" className="h-4 w-4" /> Clear
                  </button>
                </div>
                <div className="flex flex-wrap items-center gap-3 pt-2 text-[11px] text-white/60">
                  <span className="inline-flex items-center gap-1.5"><Icon name="zap" className="h-3 w-3 text-brand-100" /> Skills graph</span>
                  <span className="inline-flex items-center gap-1.5"><Icon name="bookmark-check" className="h-3 w-3 text-ok-500" /> Citations</span>
                  <span className="inline-flex items-center gap-1.5"><Icon name="lock" className="h-3 w-3 text-ok-500" /> Tamper-evident</span>
                  <span className="inline-flex items-center gap-1.5"><Icon name="scale" className="h-3 w-3 text-ok-500" /> 4/5 rule logged</span>
                </div>
              </div>
              <div className="hidden lg:col-span-2 lg:block">
                <div className="rounded-xl border border-white/10 bg-white/5 p-5 backdrop-blur">
                  <div className="mb-3 text-[11px] font-semibold uppercase tracking-[0.2em] text-white/60">What you'll see</div>
                  <ul className="space-y-2 text-sm">
                    {[
                      'Real skill extraction (no LLM call needed)',
                      'Explainable score with breakdown',
                      'Highlighted matches in JD & resume',
                      'Auto-drafted offer letter',
                      'LL144 audit log entry',
                      'Productivity & cost savings'
                    ].map((it, i) => (
                      <li key={i} className="flex items-start gap-2 text-white/85">
                        <Icon name="check" className="mt-0.5 h-4 w-4 text-ok-500" />
                        {it}
                      </li>
                    ))}
                  </ul>
                </div>
              </div>
            </div>
          </div>
        );
      }

      function DemoInput({ label, placeholder, value, onChange, disabled, icon, highlight, parts }) {
        return (
          <Card padded={false} className="overflow-hidden">
            <div className="flex items-center justify-between border-b border-surface-200 px-4 py-3">
              <div className="flex items-center gap-2 text-sm font-semibold text-ink-900">
                <Icon name={icon} className="h-4 w-4 text-ink-600" /> {label}
              </div>
              <div className="text-[11px] text-ink-600">{value ? value.length.toLocaleString() + ' chars' : 'empty'}</div>
            </div>
            {highlight && parts ? (
              <div className="scroll-soft max-h-[420px] overflow-y-auto whitespace-pre-wrap break-words p-4 font-mono text-[12.5px] leading-relaxed text-ink-800">
                {parts.map((p, i) => (typeof p === 'string'
                  ? <span key={i}>{p}</span>
                  : <mark key={i} className={p.tone === 'match' ? 'skill-mark' : 'skill-mark-miss'}>{p.text}</mark>))}
              </div>
            ) : (
              <textarea
                value={value}
                onChange={(e) => onChange(e.target.value)}
                disabled={disabled}
                placeholder={placeholder}
                rows={16}
                className="block w-full resize-none border-0 bg-white px-4 py-3 font-mono text-[12.5px] leading-relaxed text-ink-800 placeholder:text-ink-400 focus:ring-0"
              />
            )}
          </Card>
        );
      }

      function Pipeline({ phase, stepIdx, elapsedMs, result }) {
        return (
          <Card>
            <div className="mb-4 flex items-center justify-between">
              <div>
                <div className="text-sm font-semibold text-ink-900">Live agent pipeline</div>
                <div className="text-xs text-ink-600">Six agents collaborating. Every action is logged.</div>
              </div>
              <div className="flex items-center gap-3">
                <div className="font-mono text-xs text-ink-600">Elapsed: {(elapsedMs/1000).toFixed(2)}s</div>
                <Pill tone={phase === 'done' ? 'ok' : 'brand'} dot>{phase === 'done' ? 'Complete' : 'Running'}</Pill>
              </div>
            </div>

            <div className="space-y-3">
              {PIPELINE_STEPS.map((s, i) => {
                const state = i < stepIdx ? 'done' : i === stepIdx ? 'running' : 'pending';
                if (phase === 'done') {
                  // mark all as done at end for clarity
                }
                return <PipelineStep key={s.id} step={s} state={state} idx={i} result={result} />;
              })}
            </div>
          </Card>
        );
      }

      function PipelineStep({ step, state, idx, result }) {
        const stateBg = state === 'done' ? 'border-ok-100 bg-ok-50/50' : state === 'running' ? 'border-brand-100 bg-brand-50/50' : 'border-surface-200 bg-white';
        const statusIcon = state === 'done' ? 'check-circle-2' : state === 'running' ? 'loader-2' : 'circle';
        const statusColor = state === 'done' ? 'text-ok-500' : state === 'running' ? 'text-brand-500 animate-spin' : 'text-ink-400';
        return (
          <div className={classNames('relative rounded-xl border p-4 transition-all duration-500', stateBg, state !== 'pending' && 'animate-fadeUp')}>
            <div className="flex items-start gap-4">
              <div className="relative">
                <div className={classNames('flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-lg', toneBg(step.tone))}>
                  <Icon name={step.icon} className="h-5 w-5" />
                </div>
                {idx < PIPELINE_STEPS.length - 1 && <div className={classNames('step-line', state === 'done' && 'step-line-active')} />}
              </div>
              <div className="min-w-0 flex-1">
                <div className="flex items-center justify-between gap-2">
                  <div>
                    <div className="text-sm font-semibold text-ink-900">Step {idx + 1} · {step.name}</div>
                    <div className="text-xs text-ink-600">{step.subtitle}</div>
                  </div>
                  <div className="flex items-center gap-2 text-xs">
                    <Icon name={statusIcon} className={classNames('h-4 w-4', statusColor)} />
                    <span className={classNames('font-medium', state === 'done' ? 'text-ok-700' : state === 'running' ? 'text-brand-700' : 'text-ink-500')}>
                      {state === 'done' ? 'Complete' : state === 'running' ? 'Running…' : 'Queued'}
                    </span>
                  </div>
                </div>
                {state !== 'pending' && result && <PipelineStepDetail step={step} result={result} />}
              </div>
            </div>
          </div>
        );
      }

      function PipelineStepDetail({ step, result }) {
        if (step.id === 'sourcer') {
          return (
            <div className="mt-3 grid grid-cols-1 gap-2 text-xs sm:grid-cols-3">
              <DetailKV k="JD skills extracted" v={result.jdSkills.length} />
              <DetailKV k="Resume skills extracted" v={result.resumeSkills.length} />
              <DetailKV k="Years required vs in-resume" v={(result.jdYears || '—') + ' \u2192 ' + (result.resumeYears || '—')} />
              <div className="sm:col-span-3">
                <div className="text-[10px] font-semibold uppercase tracking-wider text-ink-600">Required skills detected</div>
                <div className="mt-1 flex flex-wrap gap-1">{result.jdSkills.slice(0, 12).map((s) => <SkillChip key={s} skill={s} matched={result.matched.includes(s)} />)}</div>
              </div>
            </div>
          );
        }
        if (step.id === 'screener') {
          return (
            <div className="mt-3 space-y-3">
              <div className="flex items-center gap-3">
                <ScoreBadge score={result.score} />
                <div className="flex-1">
                  <div className="mb-1 flex items-center justify-between text-xs"><span className="font-semibold text-ink-700">Match strength</span><span className="font-mono text-ink-900">{result.matchPercent}%</span></div>
                  <ProgressBar value={result.matchPercent} max={100} tone={result.score >= 80 ? 'ok' : result.score >= 60 ? 'warn' : 'danger'} />
                </div>
              </div>
              <div className="grid grid-cols-1 gap-2 text-xs sm:grid-cols-5">
                {result.breakdown.map((b) => (
                  <div key={b.label} className="rounded-lg border border-surface-200 bg-white p-2.5">
                    <div className="text-[10px] font-semibold uppercase tracking-wider text-ink-600">{b.label}</div>
                    <div className="mt-1 flex items-baseline gap-1"><span className="text-lg font-bold text-ink-900">{b.got}</span><span className="text-xs text-ink-500">/{b.max}</span></div>
                    <div className="mt-1 text-[11px] text-ink-600">{b.detail}</div>
                  </div>
                ))}
              </div>
              {result.citations.length > 0 && (
                <div className="rounded-lg border border-surface-200 bg-white p-3">
                  <div className="mb-2 text-[10px] font-semibold uppercase tracking-wider text-ink-600">Top citations from resume</div>
                  <ul className="space-y-1.5 text-xs">
                    {result.citations.slice(0, 4).map((c, i) => (
                      <li key={i} className="flex items-start gap-2 text-ink-700">
                        <Icon name="quote" className="mt-0.5 h-3.5 w-3.5 flex-shrink-0 text-ok-600" />
                        <span><span className="rounded bg-ok-50 px-1 py-0.5 font-semibold text-ok-700">{c.skill}</span> — “{c.snippet}”</span>
                      </li>
                    ))}
                  </ul>
                </div>
              )}
            </div>
          );
        }
        if (step.id === 'rubric') {
          return (
            <div className="mt-3">
              <div className="mb-1 text-[10px] font-semibold uppercase tracking-wider text-ink-600">Generated interview rubric (5 questions)</div>
              <ul className="space-y-1 text-xs text-ink-700">
                {result.rubric.map((q, i) => (
                  <li key={i} className="flex items-start gap-2">
                    <span className="mt-0.5 inline-flex h-4 w-4 flex-shrink-0 items-center justify-center rounded-full bg-emerald-100 text-[10px] font-bold text-emerald-700">{i+1}</span>
                    <span>{q}</span>
                  </li>
                ))}
              </ul>
            </div>
          );
        }
        if (step.id === 'scheduler') {
          const slots = ['Tue 10:00 AM ET','Wed 2:30 PM ET','Thu 11:00 AM ET'];
          return (
            <div className="mt-3 grid grid-cols-1 gap-2 sm:grid-cols-3">
              {slots.map((s, i) => (
                <div key={s} className={classNames('rounded-lg border p-2.5 text-xs', i === 0 ? 'border-amber-200 bg-amber-50' : 'border-surface-200 bg-white')}>
                  <div className="flex items-center justify-between"><span className="font-semibold text-ink-900">{s}</span>{i === 0 && <Icon name="check-circle-2" className="h-3.5 w-3.5 text-amber-700" />}</div>
                  <div className="mt-0.5 text-ink-600">{i === 0 ? 'Selected · panel of 3 confirmed' : 'Alternative slot'}</div>
                </div>
              ))}
            </div>
          );
        }
        if (step.id === 'offer') {
          if (result.score < 75) {
            return <div className="mt-3 text-xs text-amber-700">Score below threshold (75) — offer step skipped. Recruiter will manually review.</div>;
          }
          return (
            <div className="mt-3 grid grid-cols-2 gap-2 text-xs sm:grid-cols-4">
              <div className="rounded-lg border border-surface-200 bg-white p-2.5"><div className="text-[10px] font-semibold uppercase tracking-wider text-ink-600">Base</div><div className="mt-1 text-base font-bold text-ink-900">{fmtUSD(result.offer.base)}</div></div>
              <div className="rounded-lg border border-surface-200 bg-white p-2.5"><div className="text-[10px] font-semibold uppercase tracking-wider text-ink-600">Equity</div><div className="mt-1 text-[12px] text-ink-900">{result.offer.equity}</div></div>
              <div className="rounded-lg border border-surface-200 bg-white p-2.5"><div className="text-[10px] font-semibold uppercase tracking-wider text-ink-600">Location</div><div className="mt-1 text-[12px] text-ink-900">{result.offer.location}</div></div>
              <div className="rounded-lg border border-surface-200 bg-white p-2.5"><div className="text-[10px] font-semibold uppercase tracking-wider text-ink-600">Start</div><div className="mt-1 text-[12px] text-ink-900">{result.offer.start}</div></div>
            </div>
          );
        }
        if (step.id === 'audit') {
          return (
            <div className="mt-3 rounded-lg border border-ok-100 bg-ok-50 p-3 text-xs text-ok-700">
              <div className="flex flex-wrap items-center gap-x-3 gap-y-1">
                <span className="font-semibold">Event written.</span>
                <span className="font-mono text-[11px]">decision_id={result.candidateId}</span>
                <span className="font-mono text-[11px]">prev={shortHash()}</span>
                <span className="font-mono text-[11px]">this={shortHash()}</span>
                <span className="font-mono text-[11px]">model=screener-v3.2</span>
              </div>
              <div className="mt-1 text-[11px] text-ok-600">10-day candidate notice queued for delivery (Local Law 144 §20-871-c).</div>
            </div>
          );
        }
        return null;
      }

      function DetailKV({ k, v }) {
        return (
          <div className="rounded-lg border border-surface-200 bg-white p-2.5">
            <div className="text-[10px] font-semibold uppercase tracking-wider text-ink-600">{k}</div>
            <div className="mt-0.5 text-sm font-bold text-ink-900">{v}</div>
          </div>
        );
      }

      function SkillChip({ skill, matched }) {
        return (
          <span className={classNames('inline-flex items-center gap-1 rounded-md border px-1.5 py-0.5 text-[11px] font-medium',
            matched ? 'border-ok-100 bg-ok-50 text-ok-700' : 'border-amber-100 bg-amber-50 text-amber-700')}>
            <Icon name={matched ? 'check' : 'minus'} className="h-2.5 w-2.5" /> {skill}
          </span>
        );
      }

      function ScoreBadge({ score }) {
        const tone = score >= 90 ? 'ok' : score >= 75 ? 'brand' : score >= 60 ? 'warn' : 'danger';
        const toneClass = ({ ok: 'border-ok-100 bg-gradient-to-br from-ok-50 to-white text-ok-700', brand: 'border-brand-100 bg-gradient-to-br from-brand-50 to-white text-brand-700', warn: 'border-warn-100 bg-gradient-to-br from-warn-50 to-white text-warn-700', danger: 'border-danger-100 bg-danger-50 text-danger-600' })[tone];
        return (
          <div className={classNames('flex h-16 w-16 flex-shrink-0 flex-col items-center justify-center rounded-xl border', toneClass)}>
            <div className="text-[10px] font-semibold uppercase tracking-wider opacity-80">Score</div>
            <div className="text-2xl font-bold leading-none">{score}</div>
          </div>
        );
      }

      function ResultsHeader({ result }) {
        const recommend = result.score >= 90 ? 'Strong proceed' : result.score >= 75 ? 'Proceed' : result.score >= 60 ? 'Borderline — recruiter review' : 'Likely decline';
        const recTone = result.score >= 90 ? 'ok' : result.score >= 75 ? 'brand' : result.score >= 60 ? 'warn' : 'danger';
        return (
          <Card className="animate-fadeUp">
            <div className="flex flex-col items-start justify-between gap-4 md:flex-row md:items-center">
              <div className="flex items-center gap-4">
                <ScoreBadge score={result.score} />

      /* ---------------------------------------------------------------------------
         Activity feed (used on Dashboard + Agents)
         --------------------------------------------------------------------------- */
      function ActivityFeed({ compact }) {
        const [items, setItems] = useState(() => seedFeed(7));
        useEffect(() => {
          const t = setInterval(() => setItems((prev) => [makeFeedItem(), ...prev].slice(0, compact ? 8 : 14)), 2400);
          return () => clearInterval(t);
        }, [compact]);
        return (
          <div className="scroll-soft mt-3 max-h-[420px] space-y-2 overflow-y-auto pr-1">
            {items.map((it) => (
              <div key={it.id} className="feed-in flex items-start gap-3 rounded-lg border border-surface-200 bg-surface-50/60 px-3 py-2">
                <div className={classNames('mt-0.5 h-2 w-2 flex-shrink-0 rounded-full', dotColor(it.tone))}></div>
                <div className="min-w-0 flex-1">
                  <div className="text-[13px] text-ink-800">
                    <span className="font-semibold">{it.agent}</span> <span className="text-ink-600">{it.verb}</span> <span className="text-ink-600">{it.noun}</span> <span className="font-mono text-ink-900">{it.target}</span>
                  </div>
                  <div className="mt-0.5 flex items-center gap-2 text-[11px] text-ink-600">
                    <span>{it.timeAgo}</span><span>·</span><span className="font-mono">ev {it.hash}</span>
                  </div>
                </div>
              </div>
            ))}
          </div>
        );
      }
      let __feedSeq = 1;
      function makeFeedItem() {
        const t = FEED_TEMPLATES[Math.floor(Math.random() * FEED_TEMPLATES.length)];
        const target = 'REQ-' + (200 + Math.floor(Math.random() * 60)) + ' / CND-' + (10000 + Math.floor(Math.random() * 800));
        const hash = '0x' + Math.random().toString(16).slice(2, 6) + '\u2026' + Math.random().toString(16).slice(2, 4);
        return { id: ++__feedSeq + '-' + Date.now(), ...t, target, hash, timeAgo: 'just now' };
      }
      function seedFeed(n) {
        const out = [];
        const ages = ['just now','12s ago','34s ago','1m ago','2m ago','3m ago','4m ago','6m ago'];
        for (let i = 0; i < n; i++) out.push({ ...makeFeedItem(), timeAgo: ages[i] || (i + 'm ago') });
        return out;
      }

        );
      }
      function FitCard({ num, title, body }) {
        return (
          <Card>
            <div className="flex items-start gap-4">
              <div className="font-mono text-2xl font-bold text-brand-500/80">{num}</div>
              <div>
                <div className="text-sm font-bold text-ink-900">{title}</div>
                <div className="mt-1 text-sm leading-relaxed text-ink-700">{body}</div>
              </div>
            </div>
          </Card>
        );
      }
      function RoiCard({ kpi, label, sub }) {
        return (
          <div className="rounded-xl border border-surface-200 bg-gradient-to-br from-brand-50 via-white to-ok-50 p-4">
            <div className="text-3xl font-bold gradient-text">{kpi}</div>
            <div className="mt-1 text-sm font-semibold text-ink-900">{label}</div>
            <div className="mt-1 text-xs text-ink-600">{sub}</div>
          </div>
        );
      }

      /* ---------------------------------------------------------------------------
         App shell
         --------------------------------------------------------------------------- */
      function App() {
        const [active, setActive] = useState('demo');

        const [theme, setTheme] = useState(() => {
          try {
            const saved = localStorage.getItem('auditready-theme');
            if (saved === 'dark' || saved === 'light') return saved;
          } catch (_e) {}
          if (typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
          return 'light';
        });

        useEffect(() => {
          document.documentElement.setAttribute('data-theme', theme);
          try { localStorage.setItem('auditready-theme', theme); } catch (_e) {}
        }, [theme]);

        const toggleTheme = () => setTheme(t => (t === 'dark' ? 'light' : 'dark'));

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        const titles = {
          demo: { eyebrow: 'Live Demo', title: 'Run the agentic hiring pipeline on your own data', subtitle: 'Paste a job description and a resume below. Six agents will execute the screening pipeline in your browser, in real time, with every decision logged for audit.' },
          dashboard: { eyebrow: 'Executive Dashboard', title: 'Hiring & compliance at a glance', subtitle: 'Real-time view across all open requisitions, agent productivity, and Local Law 144 status.' },
          agents: { eyebrow: 'Agentic Hiring Crew', title: 'Six SAP-native agents working as one team', subtitle: 'Sourcer · Screener · Interviewer · Scheduler · Offer Drafter · Audit — orchestrated on SAP BTP + AI Core, surfaced through SAP Joule.' },
          candidates: { eyebrow: 'Recruiter Workspace', title: 'Candidates with explainable AI scoring', subtitle: 'Every score is explainable, every override is logged. Designed to be defensible in court.' },
          audit: { eyebrow: 'Independent Third-Party Audit', title: 'NYC Local Law 144 — Annual bias audit', subtitle: 'Auto-computed selection rates, four-fifths rule, intersectional analysis, and a publishable Public Summary. Cross-walks to EEOC, IL AIVIA, CO AI Act, and EU AI Act.' },
          compliance: { eyebrow: 'Compliance Cockpit', title: 'Operations view for legal & compliance', subtitle: 'AEDT inventory, candidate-notice delivery log, SAP integration health, and a tamper-evident audit log.' },
          fit: { eyebrow: 'Strategic fit', title: 'Why this product fits an SAP-anchored consultancy', subtitle: 'A working brief on the structural reasons this is the right product for the right firm at the right moment.' },
        };
        const t = titles[active];

        return (
          <div className="flex h-full">
            <Sidebar active={active} setActive={setActive} />
            <main className="flex flex-1 flex-col overflow-hidden bg-surface-50">
              <Topbar titleEyebrow={t.eyebrow} title={t.title} subtitle={t.subtitle} right={null} theme={theme} onToggleTheme={toggleTheme} />
              <div className="scroll-soft flex-1 overflow-y-auto px-8 py-6">
                {active === 'demo' && <LiveDemoPage />}
                {active === 'dashboard' && <DashboardPage />}
                {active === 'agents' && <AgentsPage />}
                {active === 'candidates' && <CandidatesPage />}
                {active === 'audit' && <BiasAuditPage />}
                {active === 'compliance' && <CompliancePage />}
                {active === 'fit' && <WhyFitPage />}
                <footer className="mt-10 border-t border-surface-200 pt-4 text-center text-[11px] text-ink-600">
                  AuditReady · working demo · {new Date().getFullYear()} · UI mock; production runs on SAP BTP + AI Core
                </footer>
              </div>
            </main>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
